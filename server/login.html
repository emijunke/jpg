<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar — Orden de compra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #152028;
        --muted: #5c6b76;
        --accent: #147a72;
        --accent-deep: #0d5a54;
        --danger: #b42318;
        --line: #b7c4c8;
        --font-display: "Outfit", sans-serif;
        --font-body: "IBM Plex Sans", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: var(--font-body);
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 45% at 0% 0%, rgba(20, 122, 114, 0.16), transparent 55%),
          linear-gradient(160deg, #d5e3e0 0%, #e4ebe9 45%, #d9e2e4 100%);
      }
      .card {
        width: min(420px, calc(100% - 2rem));
        background: #fff;
        border: 1px solid rgba(21, 32, 40, 0.08);
        border-radius: 10px;
        padding: 1.6rem 1.5rem 1.4rem;
        box-shadow: 0 10px 30px rgba(21, 32, 40, 0.07);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-family: var(--font-display);
        font-size: 1.55rem;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      label {
        display: grid;
        gap: 0.35rem;
        margin-bottom: 0.9rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: #3d4d58;
      }
      input {
        width: 100%;
        border: 1.5px solid var(--line);
        border-radius: 7px;
        padding: 0.72rem 0.8rem;
        font: inherit;
        font-size: 1rem;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(20, 122, 114, 0.18);
      }
      button {
        width: 100%;
        margin-top: 0.35rem;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #f4fffd;
        font: inherit;
        font-weight: 650;
        font-size: 1rem;
        padding: 0.9rem 1.2rem;
        cursor: pointer;
      }
      button:hover { background: var(--accent-deep); }
      button:disabled { opacity: 0.6; cursor: wait; }
      .error {
        display: none;
        margin: 0 0 0.9rem;
        color: var(--danger);
        font-size: 0.9rem;
        font-weight: 500;
      }
      .error.show { display: block; }
    </style>
  </head>
  <body>
    <form class="card" id="login-form" autocomplete="on">
      <h1>Ingresar</h1>
      <p class="sub">Orden de compra</p>
      <p class="error" id="error" role="alert"></p>
      <label>
        Usuario
        <input name="username" id="username" required autocomplete="username" />
      </label>
      <label>
        Contraseña
        <input
          type="password"
          name="password"
          id="password"
          required
          autocomplete="current-password"
        />
      </label>
      <button type="submit" id="submit">Entrar</button>
    </form>
    <script>
      const form = document.getElementById("login-form");
      const error = document.getElementById("error");
      const submit = document.getElementById("submit");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.classList.remove("show");
        error.textContent = "";
        submit.disabled = true;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            error.textContent = data.error || "Usuario o contraseña incorrectos.";
            error.classList.add("show");
            return;
          }
          location.href = "/";
        } catch {
          error.textContent = "No se pudo conectar con el servidor.";
          error.classList.add("show");
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
